services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: homeserve, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [homeserve_data:/var/lib/postgresql/data]
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter api start:dev"
    volumes: [".:/app"]
    ports: ["4000:4000"]
    environment: { DATABASE_URL: postgresql://postgres:postgres@postgres:5432/homeserve }
    depends_on: [postgres]
volumes: { homeserve_data: {} }

