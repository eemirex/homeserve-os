[build]
command = "pnpm --filter web build"
publish = "apps/web/out"
[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "10.12.1"
STATIC_EXPORT = "true"
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

